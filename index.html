<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Mie Gacoan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
      <img src="https://antiribet.miegacoan.id/background/Logo-.png" alt="logo" class="logo" style="width: 80px; height: auto;">
    </header>

    <!-- Kontainer Utama -->
    <div class="main-container">

        <!-- Navigasi Kategori Menu -->
        <nav class="nav-kategori no-scrollbar" aria-label="Kategori Menu">
            <button onclick="filterMenu('Semua')" class="btn-filter active">
                Semua Menu
            </button>
            <button onclick="filterMenu('Mie')" class="btn-filter">
                Mie
            </button>
            <button onclick="filterMenu('Dimsum')" class="btn-filter">
                Dimsum
            </button>
            <button onclick="filterMenu('Minuman')" class="btn-filter">
                Minuman
            </button>
        </nav>

        <!-- Layout Utama: Grid Produk & Sidebar Keranjang -->
        <main class="main-layout">
            
            <!-- Grid Produk -->
            <section id="menu-grid" class="menu-grid">
                <!-- Diisi otomatis oleh JavaScript -->
            </section>

            <!-- Sidebar Keranjang Belanja -->
            <aside class="sidebar-cart">
                <div class="cart-box">
                    <div class="cart-header">
                        <h2>Keranjang Pesanan</h2>
                        <button onclick="resetCart()" class="btn-reset">
                            Kosongkan
                        </button>
                    </div>

                    <!-- List Item Keranjang -->
                    <ul id="cart-list" class="cart-list">
                        <!-- Diisi otomatis oleh JS -->
                    </ul>

                    <!-- Ringkasan & Tombol Checkout -->
                    <div class="cart-summary">
                        <div class="summary-row text-sm">
                            <span>Total Jumlah Porsi:</span>
                            <span id="cart-count" class="summary-val-bold">0 Porsi</span>
                        </div>
                        <div class="summary-row text-lg">
                            <span>Total Pembayaran:</span>
                            <span id="cart-total" class="summary-total">Rp 0</span>
                        </div>

                        <!-- Tombol Checkout -->
                        <button onclick="checkout()" class="btn-checkout">
                            <span>Pesan Sekarang</span>
                            <span>➔</span>
                        </button>

                        <!-- Pesan Sukses -->
                        <div id="order-message" class="order-message hidden">
                            Terima Kasih Atas Pembelian Anda!
                        </div>
                    </div>
                </div>
            </aside>

        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p class="copyright">&copy; 2026 Mie Gacoan Indonesia. All rights reserved.</p>
        <p class="address">Jl. Khatulistiwa No.300a, Siantan Hilir, Kec. Pontianak Utara, Kota Pontianak, Kalimantan Barat 78243</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
